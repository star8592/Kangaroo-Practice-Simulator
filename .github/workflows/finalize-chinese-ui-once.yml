name: Finalize Chinese UI Once

on:
  push:
    branches:
      - fix/chinese-ui-final-pass
    paths:
      - scripts/finalize_chinese_ui_once.py
      - .github/workflows/finalize-chinese-ui-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/chinese-ui-final-pass
          fetch-depth: 0

      - name: Apply final Chinese UI pass
        run: |
          python3 scripts/finalize_chinese_ui_once.py
          python3 scripts/audit_chinese_ui.py

      - name: Commit finalized sources and self-remove
        run: |
          rm -f scripts/finalize_chinese_ui_once.py .github/workflows/finalize-chinese-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_chinese_ui.py \
            'src/app/admin/students/[id]/page.tsx' \
            src/components/ArithmeticDashboard.tsx \
            src/components/ExamClient.tsx \
            src/components/HomeClient.tsx \
            src/components/LoginClient.tsx \
            src/components/ParentLoginClient.tsx \
            src/components/ParentRegisterClient.tsx \
            scripts/finalize_chinese_ui_once.py \
            .github/workflows/finalize-chinese-ui-once.yml
          git commit -m "fix: finish Chinese-default interface localization"
          git push origin HEAD:fix/chinese-ui-final-pass

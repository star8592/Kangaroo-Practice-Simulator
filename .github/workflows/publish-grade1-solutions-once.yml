name: Publish Grade1 Solutions Once

on:
  push:
    branches:
      - fix/grade1-solution-publish

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/grade1-solution-publish
          fetch-depth: 0

      - name: Extract exact verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/grade1-publish-payload.00 \
              .github/grade1-publish-payload.01 \
              .github/grade1-publish-payload.02 \
              .github/grade1-publish-payload.03 \
            | base64 -d > /tmp/grade1.txz
          tar -xJf /tmp/grade1.txz
          python3 scripts/test_grade1_solution_bundle.py

      - name: Commit product files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/grade1-publish-payload.00 \
                .github/grade1-publish-payload.01 \
                .github/grade1-publish-payload.02 \
                .github/grade1-publish-payload.03 \
                .github/workflows/publish-grade1-solutions-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/verified-solutions/grade1-v1.json \
            ops/automation/quality_gate.sh \
            scripts/build_verified_grade1_solution_bundle.py \
            scripts/test_grade1_solution_bundle.py \
            scripts/test_grade1_solution_store.ts \
            src/lib/solution-store.ts \
            .github/grade1-publish-payload.00 \
            .github/grade1-publish-payload.01 \
            .github/grade1-publish-payload.02 \
            .github/grade1-publish-payload.03 \
            .github/workflows/publish-grade1-solutions-once.yml
          git diff --cached --check
          git commit -m "fix: publish verified grade-one solution bundle"
          git push origin HEAD:fix/grade1-solution-publish

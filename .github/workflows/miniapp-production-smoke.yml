name: Miniapp Production API Smoke

on:
  schedule:
    # UTC 02:20 each day; read-only catalogue checks and a disposable guest start.
    - cron: '20 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/miniapp/**'
      - 'src/app/api/miniapp/**'
      - 'src/app/api/auth/miniapp/**'
      - 'scripts/smoke_miniapp_live.ts'
      - 'scripts/smoke_exam_access_live.mjs'
      - 'scripts/run_miniapp_production_smoke.sh'
      - 'scripts/test_miniapp_production_smoke_consistency.py'
      - '.github/workflows/miniapp-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: miniapp-live-production
  cancel-in-progress: true

jobs:
  production-api-smoke:
    name: Miniapp production API smoke (NOT GUI E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify deployment transition handling with synthetic SHA changes
        run: python3 scripts/test_miniapp_production_smoke_consistency.py
      - name: Run live miniapp API and exam denial checks against one stable release
        shell: bash
        run: |
          # The checkout inside the runner can replace/delete scripts; keep
          # the controlling shell stable for this entire retry sequence.
          cp scripts/run_miniapp_production_smoke.sh "$RUNNER_TEMP/miniapp-production-smoke.sh"
          bash "$RUNNER_TEMP/miniapp-production-smoke.sh"
      - name: Clarify evidence boundary
        run: echo 'API smoke does NOT prove that WeChat buttons or wx.request work on a real phone.'

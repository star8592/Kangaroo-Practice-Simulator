name: Miniapp Production API Smoke

on:
  schedule:
    # UTC 02:20 each day; read-only catalogue checks and a disposable guest start.
    - cron: '20 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/miniapp/**'
      - 'src/app/api/miniapp/**'
      - 'src/app/api/auth/miniapp/**'
      - 'scripts/smoke_miniapp_live.ts'
      - '.github/workflows/miniapp-production-smoke.yml'

permissions:
  contents: read

concurrency:
  group: miniapp-live-production
  cancel-in-progress: true

jobs:
  production-api-smoke:
    name: Miniapp production API smoke (NOT GUI E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin smoke contract to the deployed immutable version
        id: deployed
        shell: bash
        run: |
          set -Eeuo pipefail
          DEPLOYED_SHA="$(curl --fail --silent --show-error --max-time 15 https://socthink.cn/api/release |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("ok") is True and x.get("deployedSha")==x.get("gitSha"); print(x["deployedSha"])')"
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "MINIAPP_PROD_SMOKE=BLOCKED reason=invalid_live_sha" >&2
            exit 1
          }
          # Never compare future main's contracts against the still-live old
          # code during a rolling deployment. The separate Production Receipt
          # checks the candidate SHA once it is fully promoted.
          git fetch --depth=1 origin "$DEPLOYED_SHA"
          git checkout --detach "$DEPLOYED_SHA"
          echo "deployed_sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "MINIAPP_PROD_SMOKE_SOURCE_SHA=$DEPLOYED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify live guest, catalogue, analytics and arithmetic start
        run: npm run test:miniapp-live
      - name: Deny signed Web and miniapp guests from complete exams
        env:
          BASE_URL: https://socthink.cn
          EXPECTED_SHA: ${{ steps.deployed.outputs.deployed_sha }}
        run: npm run test:exam-access-live
      - name: Clarify evidence boundary
        run: echo 'API smoke does NOT prove that WeChat buttons or wx.request work on a real phone.'

name: Rust Catalog R1

on:
  pull_request:
    paths:
      - 'backend/socthink-core/**'
      - 'scripts/test_rust_voucher_api.sh'
      - 'ops/db/drafts/channel_voucher_receipt_projection.sql'
      - 'ops/db/drafts/exam_access_usage.sql'
      - 'ops/db/drafts/exam_paper_access.sql'
      - 'ops/db/drafts/channel_exam_bridge.sql'
      - 'scripts/export_training_resource_catalog.ts'
      - 'scripts/test_rust_catalog_snapshot.ts'
      - 'scripts/lib/catalog-snapshot-atomic.ts'
      - 'scripts/publish_training_resource_snapshot.ts'
      - 'scripts/test_catalog_snapshot_atomic.ts'
      - 'scripts/test_rust_catalog_hot_reload.py'
      - 'scripts/test_rust_grade_parity.ts'
      - 'scripts/test_rust_grade_boundary.mjs'
      - 'scripts/test_rust_grade_real_stock_parity.ts'
      - 'scripts/check_rust_binary_abi.py'
      - 'scripts/promote_rust_catalog_snapshot.ts'
      - 'scripts/refresh_rust_catalog.sh'
      - 'scripts/test_rust_catalog_promotion.py'
      - 'scripts/test_rust_catalog_content_hook.py'
      - 'ops/data/promote_student_ready.sh'
      - 'ops/systemd/socthink-catalog.service'
      - '.github/workflows/rust-catalog-r1.yml'
  push:
    branches: [main]
    paths:
      - 'backend/socthink-core/**'
      - 'scripts/test_rust_voucher_api.sh'
      - 'ops/db/drafts/channel_voucher_receipt_projection.sql'
      - 'ops/db/drafts/exam_access_usage.sql'
      - 'ops/db/drafts/exam_paper_access.sql'
      - 'ops/db/drafts/channel_exam_bridge.sql'
      - 'scripts/export_training_resource_catalog.ts'
      - 'scripts/test_rust_catalog_snapshot.ts'
      - 'scripts/lib/catalog-snapshot-atomic.ts'
      - 'scripts/publish_training_resource_snapshot.ts'
      - 'scripts/test_catalog_snapshot_atomic.ts'
      - 'scripts/test_rust_catalog_hot_reload.py'
      - 'scripts/test_rust_grade_parity.ts'
      - 'scripts/test_rust_grade_boundary.mjs'
      - 'scripts/test_rust_grade_real_stock_parity.ts'
      - 'scripts/check_rust_binary_abi.py'
      - 'scripts/promote_rust_catalog_snapshot.ts'
      - 'scripts/refresh_rust_catalog.sh'
      - 'scripts/test_rust_catalog_promotion.py'
      - 'scripts/test_rust_catalog_content_hook.py'
      - 'ops/data/promote_student_ready.sh'
      - 'ops/systemd/socthink-catalog.service'
      - '.github/workflows/rust-catalog-r1.yml'

permissions:
  contents: read

concurrency:
  group: rust-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: socthink_voucher_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socthink_voucher_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable toolchain
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --manifest-path backend/socthink-core/Cargo.toml --check
      - name: Rust read-only API and catalog tests
        run: cargo test --locked --all-targets --manifest-path backend/socthink-core/Cargo.toml
      - name: Install PostgreSQL client for isolated commerce API integration
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rust voucher API isolated PostgreSQL integration
        env:
          SOCTHINK_BILLING_TEST_ISOLATED: "1"
          SOCTHINK_BILLING_DATABASE_URL: postgres://postgres:ci_only_password@127.0.0.1:5432/socthink_voucher_ci
        run: bash scripts/test_rust_voucher_api.sh
      - name: Install TypeScript contract dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify offline grader has no public endpoint or storage authority
        run: npm run test:rust-grade-boundary
      - name: Offline Rust grading parity against TypeScript (synthetic only)
        run: |
          cargo build --locked --bin grade-fixture --manifest-path backend/socthink-core/Cargo.toml
          SOCTHINK_GRADE_FIXTURE_BIN="$PWD/backend/socthink-core/target/debug/grade-fixture" npm run test:rust-grade-parity
      - name: Same metadata schema in TypeScript and Rust
        run: npx tsx scripts/test_rust_catalog_snapshot.ts
      - name: Atomic metadata publication contract
        run: npx tsx scripts/test_catalog_snapshot_atomic.ts
      - name: Ensure verified content promotion refreshes Rust on success and rollback
        run: python3 scripts/test_rust_catalog_content_hook.py
      - name: Compile Rust service and verify event-triggered zero-downtime reload
        run: |
          cargo build --locked --manifest-path backend/socthink-core/Cargo.toml
          python3 scripts/test_rust_catalog_hot_reload.py
      - name: Verify active generation and automatic snapshot rollback
        run: python3 scripts/test_rust_catalog_promotion.py

      - name: Build an x86-64 production-compatible Rust release candidate
        run: |
          # Ubuntu 24.04 provides the same glibc ABI ceiling as production.
          # Build only in the existing Rust-specific CI job, never on the
          # low-memory production server.
          cargo build --locked --release --bin socthink-catalog-api --manifest-path backend/socthink-core/Cargo.toml
          cargo build --locked --release --bin socthink-commerce-api --manifest-path backend/socthink-core/Cargo.toml
          python3 scripts/check_rust_binary_abi.py backend/socthink-core/target/release/socthink-catalog-api
          python3 scripts/check_rust_binary_abi.py backend/socthink-core/target/release/socthink-commerce-api
          mkdir -p dist
          cp backend/socthink-core/target/release/socthink-catalog-api dist/
          (cd dist && sha256sum socthink-catalog-api > sha256sum.txt)
          printf '%s\n' "$GITHUB_SHA" > dist/source_sha.txt
          printf 'RUST_PORTABLE_CANDIDATE=PASS source=%s\n' "$GITHUB_SHA"
      - name: Archive verified candidate binary for isolated runtime acceptance
        uses: actions/upload-artifact@v4
        with:
          name: socthink-catalog-linux-x86_64
          path: dist/
          retention-days: 14

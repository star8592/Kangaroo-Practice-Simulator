name: Rust Catalog R1

on:
  pull_request:
    paths:
      - 'backend/socthink-core/**'
      - 'scripts/export_training_resource_catalog.ts'
      - 'scripts/test_rust_catalog_snapshot.ts'
      - 'scripts/lib/catalog-snapshot-atomic.ts'
      - 'scripts/publish_training_resource_snapshot.ts'
      - 'scripts/test_catalog_snapshot_atomic.ts'
      - 'scripts/test_rust_catalog_hot_reload.py'
      - 'scripts/check_rust_binary_abi.py'
      - '.github/workflows/rust-catalog-r1.yml'
  push:
    branches: [main]
    paths:
      - 'backend/socthink-core/**'
      - 'scripts/export_training_resource_catalog.ts'
      - 'scripts/test_rust_catalog_snapshot.ts'
      - 'scripts/lib/catalog-snapshot-atomic.ts'
      - 'scripts/publish_training_resource_snapshot.ts'
      - 'scripts/test_catalog_snapshot_atomic.ts'
      - 'scripts/test_rust_catalog_hot_reload.py'
      - 'scripts/check_rust_binary_abi.py'
      - '.github/workflows/rust-catalog-r1.yml'

permissions:
  contents: read

concurrency:
  group: rust-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable toolchain
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --manifest-path backend/socthink-core/Cargo.toml --check
      - name: Rust read-only API and catalog tests
        run: cargo test --locked --all-targets --manifest-path backend/socthink-core/Cargo.toml
      - name: Install TypeScript contract dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Same metadata schema in TypeScript and Rust
        run: npx tsx scripts/test_rust_catalog_snapshot.ts
      - name: Atomic metadata publication contract
        run: npx tsx scripts/test_catalog_snapshot_atomic.ts
      - name: Compile Rust service and verify event-triggered zero-downtime reload
        run: |
          cargo build --locked --manifest-path backend/socthink-core/Cargo.toml
          python3 scripts/test_rust_catalog_hot_reload.py

      - name: Build an x86-64 production-compatible Rust release candidate
        run: |
          # Ubuntu 24.04 provides the same glibc ABI ceiling as production.
          # Build only in the existing Rust-specific CI job, never on the
          # low-memory production server.
          cargo build --locked --release --manifest-path backend/socthink-core/Cargo.toml
          python3 scripts/check_rust_binary_abi.py backend/socthink-core/target/release/socthink-catalog-api
          mkdir -p dist
          cp backend/socthink-core/target/release/socthink-catalog-api dist/
          (cd dist && sha256sum socthink-catalog-api > sha256sum.txt)
          printf '%s\n' "$GITHUB_SHA" > dist/source_sha.txt
          printf 'RUST_PORTABLE_CANDIDATE=PASS source=%s\n' "$GITHUB_SHA"
      - name: Archive verified candidate binary for isolated runtime acceptance
        uses: actions/upload-artifact@v4
        with:
          name: socthink-catalog-linux-x86_64
          path: dist/
          retention-days: 14

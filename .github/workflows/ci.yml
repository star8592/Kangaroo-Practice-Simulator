name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Public quality gate
        run: npm run verify:public

  billing-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: socthink_billing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socthink_billing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: PostgreSQL ledger integration tests
        env:
          SOCTHINK_BILLING_TEST_ISOLATED: "1"
          SOCTHINK_BILLING_DATABASE_URL: postgres://postgres:ci_only_password@127.0.0.1:5432/socthink_billing_ci
        run: npm run test:billing-ledger

  # Independent miniapp checks: main Web build does not compile Taro/WeApp.
  # Passing this job does NOT constitute WeChat simulator or real-device E2E approval.
  miniapp-build-and-contract:
    name: Miniapp build and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Web dependencies
        run: npm ci
      - name: WeChat client network error regression
        run: node --experimental-strip-types --test scripts/test_miniapp_network_errors.mjs
      - name: Miniapp arithmetic session contract
        run: npm run test:miniapp-contract
      - name: Miniapp WeChat identity contract (mocked provider)
        run: npx tsx scripts/test_miniapp_wechat_auth.ts
      - name: Miniapp and Web data parity
        run: npm run test:miniapp-parity
      - name: Unverified WeChat build cannot be uploaded
        run: node scripts/e2e/test-fail-closed.cjs
      - name: Typecheck and compile actual WeChat miniapp artifacts
        run: npm run verify:miniapp

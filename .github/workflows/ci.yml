name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Production receipt concurrency contract
        run: node scripts/test_production_receipt_policy.mjs

      - name: Private digital delivery file safety
        run: npm run test:digital-resource-file

      - name: Digital sales policy explicit consent
        run: npm run test:digital-sales-policy

      - name: Consistent portal commerce and account surface
        run: npm run test:portal-commerce

      - name: WeChat payment readiness uses real runtime flags
        run: python3 scripts/test_payment_readiness.py

      - name: Unified commerce registry and WeChat ownership contract
        run: npx tsx scripts/test_platform_billing_contract.mts

      - name: JSAPI same-phone protocol and RSA signing (offline)
        run: npx tsx scripts/test_wechat_jsapi_pure.mts

      - name: Native classroom Web contracts
        run: npm run test:classroom-embedded

      - name: Platform authorization bootstrap installer regression
        run: python3 scripts/test_platform_runtime_installer.py

      - name: Organization-seat backup invocation regression
        run: python3 scripts/test_billing_org_installer.py

      - name: Public quality gate
        run: npm run verify:public

  # Separate GitHub runners keep desktop/mobile browser state, the synthetic
  # student fixture and their local Next servers isolated. Run concurrently.
  browser-e2e-shard:
    if: github.event_name == 'pull_request'
    name: Browser E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOCTHINK_RUST_CATALOG_INTERNAL_URL: http://127.0.0.1:37871
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for actual button clicks
        run: npx playwright install --with-deps chromium
      - name: Start isolated Rust catalog for browser tests (metadata fixture)
        run: |
          cargo build --locked --release --bin socthink-catalog-api --manifest-path backend/socthink-core/Cargo.toml
          SOCTHINK_CATALOG_SNAPSHOT="$GITHUB_WORKSPACE/backend/socthink-core/tests/fixtures/catalog.json" SOCTHINK_RUST_BIND=127.0.0.1:37871 nohup backend/socthink-core/target/release/socthink-catalog-api >"$RUNNER_TEMP/rust-catalog-e2e.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:37871/healthz; then break; fi
            sleep 0.5
          done
          curl -fsS 'http://127.0.0.1:37871/v1/catalog/resources?limit=100' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"]==2, "isolated metadata fixture must contain two rows"; print("RUST_CI_BROWSER_FIXTURE=PASS rows=2")'
      - name: Build candidate Web app
        run: npm run build
      - name: Browser click and login-gate E2E
        env:
          E2E_ALLOW_SYNTHETIC_FIXTURE: "1"
        run: npx playwright test --project="${{ matrix.project }}"
      - name: Career WeChat-account history with isolated data
        env:
          E2E_ALLOW_SYNTHETIC_FIXTURE: "1"
          SOCTHINK_USER_DATA_DIR: /tmp/socthink-career-history-${{ github.run_id }}-${{ matrix.project }}
        run: npx playwright test tests/e2e/career-account-history.spec.ts --project="${{ matrix.project }}"
      - name: Preserve browser screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.project }}-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Preserve the one existing required E2E status. This aggregation merely
  # asserts both actual browser shards succeeded; no additional release gate.
  web-browser-click-e2e:
    if: always() && github.event_name == 'pull_request'
    name: Web browser click E2E (desktop + mobile)
    needs: browser-e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify desktop and mobile browser shards both passed
        env:
          BROWSER_SHARDS_RESULT: ${{ needs.browser-e2e-shard.result }}
        run: |
          test "$BROWSER_SHARDS_RESULT" = "success"

  billing-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: socthink_billing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socthink_billing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: PostgreSQL ledger integration tests
        env:
          SOCTHINK_BILLING_TEST_ISOLATED: "1"
          SOCTHINK_BILLING_DATABASE_URL: postgres://postgres:ci_only_password@127.0.0.1:5432/socthink_billing_ci
        run: npm run test:billing-ledger

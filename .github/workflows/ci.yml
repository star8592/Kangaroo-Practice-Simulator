name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Public quality gate
        run: npm run verify:public

  web-browser-click-e2e:
    name: Web browser click E2E (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for actual button clicks
        run: npx playwright install --with-deps chromium
      - name: Build candidate Web app
        run: npm run build
      - name: Browser click and login-gate E2E
        env:
          E2E_ALLOW_SYNTHETIC_FIXTURE: "1"
        run: npm run test:e2e:smoke
      - name: Preserve screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  billing-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: socthink_billing_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d socthink_billing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: PostgreSQL ledger integration tests
        env:
          SOCTHINK_BILLING_TEST_ISOLATED: "1"
          SOCTHINK_BILLING_DATABASE_URL: postgres://postgres:ci_only_password@127.0.0.1:5432/socthink_billing_ci
        run: npm run test:billing-ledger

  # Independent miniapp checks: main Web build does not compile Taro/WeApp.
  # Passing this job does NOT constitute WeChat simulator or real-device E2E approval.
  miniapp-build-and-contract:
    name: Miniapp build and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Web dependencies
        run: npm ci
      - name: Miniapp arithmetic session contract
        run: npm run test:miniapp-contract
      - name: Miniapp WeChat identity contract (mocked provider)
        run: npx tsx scripts/test_miniapp_wechat_auth.ts
      - name: Miniapp WeChat upstream failure classification
        run: npx tsx scripts/test_miniapp_wechat_failure_diagnostics.ts
      - name: Miniapp and Web data parity
        run: npm run test:miniapp-parity
      - name: Typecheck and compile actual WeChat miniapp artifacts
        run: npm run verify:miniapp

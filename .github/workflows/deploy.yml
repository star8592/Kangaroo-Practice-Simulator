name: Manual Production Reconcile

# Emergency/manual re-trigger only. Canonical server service remains the sole
# builder, candidate validator, immutable publisher and rollback executor.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact main Git SHA to reconcile in production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-manual-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST || 'socthink.cn' }}
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY || secrets.SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
      REQUESTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout exact dispatch commit for public receipt validation
        uses: actions/checkout@v4
      - name: Require main ref, exact main commit and SSH key
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${{ github.ref }}" == "refs/heads/main" ]] || { echo "Main branch only"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$REQUESTED_SHA" == "$TARGET_SHA" ]] || { echo "Explicit requested SHA differs from main"; exit 1; }
          [[ -n "$SERVER_SSH_KEY" ]] || { echo "::error::SSH private key required; password-based deployment disabled"; exit 1; }
      - name: Trigger canonical CI-gated auto-deployer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            TARGET_SHA='${{ github.sha }}'
            APP='/opt/socthink-math'
            test -d "$APP/.git"
            REMOTE_SHA="$(git -C "$APP" ls-remote origin refs/heads/main | cut -f1)"
            test "$REMOTE_SHA" = "$TARGET_SHA"
            # This service validates CI green, smoke tests a candidate,
            # atomically promotes an immutable runtime and rolls back on failure.
            systemctl start socthink-auto-deploy.service
            test "$(cat "$APP/.release/deployed_sha")" = "$TARGET_SHA"
      - name: Verify exact public SHA and guest privacy gates
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 24); do
            if python3 scripts/smoke_production_public.py --base https://socthink.cn --sha "$EXPECTED_SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production receipt or anonymous privacy checks failed"
          exit 1

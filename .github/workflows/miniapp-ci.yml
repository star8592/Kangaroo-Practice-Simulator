name: Miniapp CI

on:
  pull_request:
    paths:
      - 'apps/miniapp/**'
      - 'src/lib/**'
      - 'src/data/**'
      - 'data/**'
      - 'src/app/api/**'
      - 'scripts/*miniapp*'
      - 'scripts/*wechat*'
      - 'scripts/*math_answer*'
      - 'scripts/*exam_submit*'
      - 'scripts/test_exam_submit_recovery.ts'
      - 'ops/automation/miniapp_quality_gate.sh'
      - 'ops/release/miniapp_ci.*'
      - '.github/workflows/miniapp-ci.yml'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  push:
    branches:
      - main
    paths:
      - 'apps/miniapp/**'
      - 'src/lib/**'
      - 'src/data/**'
      - 'data/**'
      - 'src/app/api/**'
      - 'scripts/*miniapp*'
      - 'scripts/*wechat*'
      - 'scripts/*math_answer*'
      - 'scripts/*exam_submit*'
      - 'scripts/test_exam_submit_recovery.ts'
      - 'ops/automation/miniapp_quality_gate.sh'
      - 'ops/release/miniapp_ci.*'
      - '.github/workflows/miniapp-ci.yml'
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A real failing miniapp build remains red in THIS independent workflow.
  # Web deploy requires only the separate CI workflow, never this one.
  # Passing this job does NOT constitute WeChat simulator or real-device E2E approval.
  miniapp-build-and-contract:
    name: Miniapp build and API contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked Web dependencies
        run: npm ci
      - name: Miniapp arithmetic session contract
        run: npm run test:miniapp-contract
      - name: Symbol keyboard and answer-kind parity (Web + Miniapp)
        run: npm run test:math-answer-input
      - name: Miniapp WeChat identity contract (mocked provider)
        run: npx tsx scripts/test_miniapp_wechat_auth.ts
      - name: Miniapp WeChat upstream failure classification
        run: npx tsx scripts/test_miniapp_wechat_failure_diagnostics.ts
      - name: Miniapp and Web data parity
        run: npm run test:miniapp-parity
      - name: Typecheck and compile actual WeChat miniapp artifacts
        run: npm run verify:miniapp

[package]
name = "socthink-rust-core"
version = "0.1.0"
edition = "2024"
description = "SOC THINK Rust Core: read-only catalogue plus offline grade parity, no public grade API"
publish = false

[[bin]]
name = "socthink-catalog-api"
path = "src/main.rs"

[[bin]]
name = "grade-fixture"
path = "src/bin/grade_fixture.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "query", "http1", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal"] }
